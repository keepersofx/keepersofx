name = "keepersofx"
compatibility_date = "2024-01-01"
main = "worker.js"

# Account details (you'll need to fill these in after creating resources)
# account_id = "your-account-id-here"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "keepersofx-db"
database_id = "database_id = "ce3fae4a-f648-4ed1-9f9f-58a18c543514"

# Workers configuration
[build]
command = ""

# Routes configuration for Cloudflare Pages
# The worker will handle /api/* routes
[env.production]
routes = [
  { pattern = "keepersofx.com/api/*", zone_name = "keepersofx.com" },
  { pattern = "www.keepersofx.com/api/*", zone_name = "keepersofx.com" }
]

# Development configuration
[env.development]
# For local development with wrangler dev
