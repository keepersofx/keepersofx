<svg width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="favicon-seal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f4e8d0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#d4b896;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a2b;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Outer circle (wax seal) -->
  <circle cx="32" cy="32" r="30" fill="url(#favicon-seal)" stroke="#5c3d1f" stroke-width="2"/>
  
  <!-- Inner decorative circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#8b5a2b" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Letter K -->
  <text x="32" y="42" font-family="Cinzel, serif" font-size="32" font-weight="700" fill="#3d2817" text-anchor="middle">K</text>
</svg>